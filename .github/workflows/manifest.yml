name: Generate Manifest

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate README.md
        run: node .github/scripts/generate-readme.mjs

      - name: Verify generated README.md
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- README.md)" ]; then
            echo "README.md is out of date. Run: node .github/scripts/generate-readme.mjs"
            exit 1
          fi

      - name: Deploy to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          node .github/scripts/generate-manifest.mjs

          # Capture the generated artifacts before switching branches
          rm -rf /tmp/ae-basecamp-dist
          mkdir -p /tmp/ae-basecamp-dist
          cp manifest.json /tmp/ae-basecamp-dist/manifest.json
          cp -R icons /tmp/ae-basecamp-dist/icons
          rm -f manifest.json

          # Switch to (or create) the dist branch — orphan so it stays minimal
          if git ls-remote --exit-code --heads origin dist; then
            git fetch origin dist
            git checkout dist
            git reset --hard origin/dist
          else
            git checkout --orphan dist
            git rm -rf . --quiet
          fi

          # Place the generated artifacts and commit
          rm -rf manifest.json icons
          cp /tmp/ae-basecamp-dist/manifest.json manifest.json
          cp -R /tmp/ae-basecamp-dist/icons icons
          git add manifest.json icons
          git diff --cached --quiet && echo "No changes to dist artifacts." && exit 0
          git commit -m "chore: update dist artifacts [skip ci]"
          git push origin dist
